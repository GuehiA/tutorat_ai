<!DOCTYPE html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Anti-cache pour éviter les problèmes d'affichage -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- Favicon VirtuEduc -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
  <meta name="msapplication-TileColor" content="#4361ee">
  <meta name="theme-color" content="#4361ee">
  
  <title>{% if lang == 'en' %}Admin Dashboard{% else %}Tableau de Bord Admin{% endif %}</title>
  
  <!-- CSS uniquement dans le head -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3a56d4;
      --primary-light: #e0e7ff;
      --success: #3fba83;
      --success-dark: #38a873;
      --success-light: #e0f7ed;
      --warning: #fcc419;
      --warning-dark: #e6b017;
      --warning-light: #fff9e6;
      --danger: #e85959;
      --danger-dark: #d14f4f;
      --danger-light: #fdeaea;
      --info: #17a2b8;
      --info-dark: #148ea1;
      --info-light: #e3f4f7;
      --light: #f8f9ff;
      --dark: #121826;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text: #2d3748;
      --text-light: #718096;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --monetization: #10b981;
      --monetization-dark: #0da271;
      --monetization-light: #e0f7ed;
    }
    
    [data-theme="dark"] {
      --light: #121826;
      --dark: #f8f9ff;
      --card-bg: rgba(30, 30, 46, 0.8);
      --text: #e2e8f0;
      --text-light: #a0aec0;
      --border: #2d3748;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--light) 0%, #e8eaff 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      transition: var(--transition);
      line-height: 1.6;
    }
    
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
    }
    
    .container-fluid {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* Dashboard Header */
    .dashboard-header {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: fadeInDown 0.6s ease-out;
    }
    
    /* Dashboard Cards */
    .dashboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
      height: 100%;
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .dashboard-card:nth-child(1) { animation-delay: 0.1s; }
    .dashboard-card:nth-child(2) { animation-delay: 0.2s; }
    .dashboard-card:nth-child(3) { animation-delay: 0.3s; }
    .dashboard-card:nth-child(4) { animation-delay: 0.4s; }
    
    .dashboard-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: var(--shadow-lg);
    }
    
    .dashboard-card .card-header {
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      padding: 20px 25px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 80px;
      flex-wrap: wrap;
    }
    
    .dashboard-card .card-body {
      padding: 25px;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    
    /* Onglets CSS Pur - Nouvelle version */
    .tab-container {
      margin-bottom: 25px;
    }
    
    .tab-list {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--border);
      list-style: none;
      padding: 0;
      margin: 0 0 20px 0;
      gap: 5px;
    }
    
    .tab-item {
      margin-bottom: -2px;
    }
    
    .tab-button {
      display: block;
      padding: 12px 25px;
      background: transparent;
      border: none;
      border-radius: var(--radius) var(--radius) 0 0;
      font-weight: 500;
      color: var(--text-light);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      font-size: 1rem;
    }
    
    .tab-button:hover {
      color: var(--primary);
    }
    
    .tab-button.active {
      color: var(--primary);
      font-weight: 600;
    }
    
    .tab-button.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
    }
    
    .tab-pane-css {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    
    .tab-pane-css.active {
      display: block;
    }
    
    /* Cache les radio buttons */
    .tab-radio {
      display: none;
    }
    
    .action-btn {
      border-radius: 10px;
      padding: 14px 18px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
      text-decoration: none;
      position: relative;
      overflow: hidden;
      border: none;
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 10px;
      text-align: left;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .action-btn::after {
      content: "";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }
    
    .action-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      border-color: transparent;
    }
    
    .action-btn:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }
    
    .action-btn i {
      font-size: 1.1rem;
      width: 24px;
      text-align: center;
    }
    
    /* User Management Card */
    .user-management .card-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
    }
    
    .user-management .action-btn:hover {
      background: linear-gradient(135deg, var(--primary-light) 0%, #d0d9ff 100%);
      color: var(--primary-dark);
    }
    
    .user-management .action-btn i {
      color: var(--primary);
    }
    
    /* Content Management Card */
    .content-management .card-header {
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
      color: white;
    }
    
    .content-management .action-btn:hover {
      background: linear-gradient(135deg, var(--success-light) 0%, #c0ebd9 100%);
      color: var(--success-dark);
    }
    
    .content-management .action-btn i {
      color: var(--success);
    }
    
    /* Evaluations Card */
    .evaluations .card-header {
      background: linear-gradient(135deg, var(--warning) 0%, var(--warning-dark) 100%);
      color: white;
    }
    
    .evaluations .action-btn:hover {
      background: linear-gradient(135deg, var(--warning-light) 0%, #ffeccc 100%);
      color: var(--warning-dark);
    }
    
    .evaluations .action-btn i {
      color: var(--warning);
    }
    
    /* Monetization Card */
    .monetization .card-header {
      background: linear-gradient(135deg, var(--monetization) 0%, var(--monetization-dark) 100%);
      color: white;
    }
    
    .monetization .action-btn:hover {
      background: linear-gradient(135deg, var(--monetization-light) 0%, #c0ebd9 100%);
      color: var(--monetization-dark);
    }
    
    .monetization .action-btn i {
      color: var(--monetization);
    }
    
    /* Stats Cards */
    .stats-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 20px;
      transition: var(--transition);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
      height: 100%;
    }
    
    .stats-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--success));
    }
    
    .stats-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }
    
    .stats-number {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    @media (max-width: 768px) {
      .stats-number {
        font-size: 2rem;
      }
    }
    
    .stats-label {
      font-size: 0.9rem;
      color: var(--text-light);
      font-weight: 500;
    }
    
    /* Language Selector */
    .lang-selector {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      padding: 8px 15px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .lang-selector .form-select {
      width: auto;
      min-width: 120px;
    }
    
    /* Theme Toggle */
    .theme-toggle {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: var(--transition);
      margin-left: 10px;
    }
    
    .theme-toggle:hover {
      transform: rotate(15deg);
    }
    
    /* Logout Button */
    .logout-btn {
      background: linear-gradient(135deg, var(--danger) 0%, var(--danger-dark) 100%);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    
    .logout-btn:hover {
      background: linear-gradient(135deg, var(--danger-dark) 0%, #c44545 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      color: white;
    }
    
    /* Quick Actions Row */
    .quick-actions-row {
      margin-top: 20px;
    }
    
    .card-icon {
      font-size: 1.5rem;
    }
    
    /* Accordion Styles */
    .accordion-button:not(.collapsed) {
      background-color: rgba(67, 97, 238, 0.1);
      color: var(--primary);
      box-shadow: none;
    }
    
    .accordion-button {
      font-weight: 600;
      padding: 15px 20px;
      background-color: var(--card-bg);
      color: var(--text);
    }
    
    .accordion-button:focus {
      box-shadow: none;
      border-color: var(--primary);
    }
    
    .accordion-item {
      background-color: transparent;
      border-color: var(--border);
    }
    
    /* Badges */
    .badge-pill {
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    /* Nested Content */
    .nested-content {
      margin-left: 15px;
      padding-left: 15px;
      border-left: 2px solid var(--border);
    }
    
    @media (max-width: 768px) {
      .nested-content {
        margin-left: 10px;
        padding-left: 10px;
      }
    }
    
    /* Content Items */
    .content-item {
      padding: 15px;
      border-left: 4px solid var(--primary);
      background: rgba(67, 97, 238, 0.05);
      margin-bottom: 10px;
      border-radius: 0 8px 8px 0;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .content-item:hover {
      background: rgba(67, 97, 238, 0.1);
      transform: translateX(5px);
    }
    
    .content-item .content-info {
      flex: 1;
      min-width: 200px;
    }
    
    .lecon-item {
      background: rgba(23, 162, 184, 0.05);
      border-left: 4px solid var(--info);
    }
    
    .exercice-item {
      background: rgba(108, 117, 125, 0.05);
      border-left: 4px solid #6c757d;
    }
    
    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .action-buttons .btn-action {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }
    
    .action-buttons .btn-action:hover {
      transform: translateY(-2px) scale(1.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    
    .action-buttons .btn-edit {
      background: var(--success);
    }
    
    .action-buttons .btn-edit:hover {
      background: var(--success-dark);
    }
    
    .action-buttons .btn-delete {
      background: var(--danger);
    }
    
    .action-buttons .btn-delete:hover {
      background: var(--danger-dark);
    }
    
    .action-buttons .btn-view {
      background: var(--info);
    }
    
    .action-buttons .btn-view:hover {
      background: var(--info-dark);
    }
    
    /* Import Batch Button */
    .import-batch-btn {
      background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
      color: white;
      border-left: 4px solid #8e44ad;
    }
    
    .import-batch-btn:hover {
      background: linear-gradient(135deg, #8e44ad 0%, #7d3c98 100%);
      color: white;
    }
    
    .import-batch-btn i {
      color: white !important;
    }
    
    /* Table Styling */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .table-monetization {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      width: 100%;
    }
    
    .table-monetization thead {
      background: linear-gradient(135deg, var(--monetization) 0%, var(--monetization-dark) 100%);
      color: white;
    }
    
    .table-monetization th {
      border: none;
      padding: 15px;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .table-monetization td {
      padding: 12px 15px;
      vertical-align: middle;
      border-color: var(--border);
    }
    
    .table-monetization tbody tr:hover {
      background: rgba(16, 185, 129, 0.05);
    }
    
    /* Badge Status */
    .badge-paid {
      background: linear-gradient(135deg, var(--success) 0%, var(--success-dark) 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .badge-pending {
      background: linear-gradient(135deg, var(--warning) 0%, var(--warning-dark) 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .badge-processing {
      background: linear-gradient(135deg, var(--info) 0%, var(--info-dark) 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    
    .badge-demande {
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }
    
    /* Payment details */
    .payment-details {
      background: var(--monetization-light);
      border-radius: var(--radius);
      padding: 15px;
      margin-top: 10px;
    }
    
    .payment-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .payment-label {
      color: var(--text-light);
    }
    
    .payment-value {
      font-weight: 600;
      color: var(--monetization-dark);
    }
    
    /* Activity list */
    .activity-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .activity-item {
      padding: 10px;
      border-radius: 8px;
      transition: var(--transition);
    }
    
    .activity-item:hover {
      background: rgba(67, 97, 238, 0.05);
    }
    
    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    /* Responsive */
    @media (min-width: 1600px) {
      .container-fluid {
        max-width: 1540px;
      }
      .dashboard-card .card-body {
        min-height: 320px;
      }
      .stats-number {
        font-size: 3rem;
      }
    }
    
    @media (max-width: 1200px) {
      .dashboard-card .card-header {
        font-size: 1.1rem;
        padding: 15px 20px;
      }
    }
    
    @media (max-width: 992px) {
      .container-fluid {
        padding: 15px;
      }
      .dashboard-header {
        padding: 20px;
      }
    }
    
    @media (max-width: 768px) {
      .container-fluid {
        padding: 10px;
      }
      .dashboard-header {
        padding: 15px;
      }
      .tab-button {
        padding: 10px 12px;
        font-size: 0.85rem;
      }
      .dashboard-card .card-header {
        padding: 15px;
        min-height: auto;
      }
      .action-btn {
        padding: 12px 15px;
        font-size: 0.9rem;
      }
      .logout-btn {
        padding: 8px 15px;
        font-size: 0.9rem;
      }
      .action-buttons {
        flex-direction: row;
        justify-content: flex-end;
      }
      .content-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .content-item .action-buttons {
        align-self: flex-end;
      }
      .table td, .table th {
        white-space: nowrap;
      }
    }
    
    @media (max-width: 576px) {
      .quick-actions-row .col-12 {
        margin-bottom: 20px;
      }
      .stats-card {
        margin-bottom: 15px;
      }
      .lang-selector .form-select {
        min-width: 100px;
        font-size: 0.85rem;
      }
      .logout-btn span {
        display: none;
      }
      .logout-btn {
        padding: 8px 12px;
      }
    }

    /* Styles pour le skeleton loading */
    .skeleton-card {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 12px;
      height: 100px;
      margin-bottom: 20px;
    }
    
    .skeleton-text {
      height: 20px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
      margin: 10px 0;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="container-fluid px-3 px-md-4 py-3 py-md-4">
    <!-- Header avec sélecteur de langue, thème et bouton de déconnexion -->
    <div class="dashboard-header">
      <div class="row align-items-center g-3">
        <div class="col-12 col-md-6">
          <h1 class="h3 mb-1">{% if lang == 'en' %}🛠️ Admin Dashboard{% else %}🛠️ Tableau de Bord Administrateur{% endif %}</h1>
          <p class="text-muted mb-0">{% if lang == 'en' %}Manage your educational platform{% else %}Gérez votre plateforme éducative{% endif %}</p>
        </div>
        <div class="col-12 col-md-6">
          <div class="d-flex flex-wrap justify-content-start justify-content-md-end align-items-center gap-2 gap-md-3">
            <div class="lang-selector">
              <form method="POST" action="/changer-langue" class="d-flex align-items-center">
                <label for="lang" class="me-2 d-none d-sm-inline">🌍</label>
                <select name="lang" id="lang" onchange="this.form.submit()" class="form-select form-select-sm border-0 bg-transparent">
                  <option value="fr" {% if lang == 'fr' %}selected{% endif %}>🇫🇷 Français</option>
                  <option value="en" {% if lang == 'en' %}selected{% endif %}>🇬🇧 English</option>
                </select>
                <input type="hidden" name="redirect_page" value="admin_dashboard">
              </form>
            </div>
            <a href="/logout" class="logout-btn">
              <i class="fas fa-sign-out-alt"></i>
              <span class="d-none d-sm-inline">{% if lang == 'en' %}Logout{% else %}Déconnexion{% endif %}</span>
            </a>
            <div class="theme-toggle" id="themeToggle">
              <i class="fas fa-moon"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Cartes de statistiques avec Skeleton Loading -->
    <div class="row g-3 g-md-4 mb-4" id="stats-cards">
      <!-- Skeleton cards affichées pendant le chargement -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="skeleton-card"></div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="skeleton-card"></div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="skeleton-card"></div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="skeleton-card"></div>
      </div>
    </div>

    <!-- Conteneur principal pour les données AJAX -->
    <div id="dashboard-content">
      <!-- Skeleton pour les onglets -->
      <div class="tab-container">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <div class="skeleton-text" style="width: 150px; height: 40px;"></div>
          <div class="skeleton-text" style="width: 150px; height: 40px;"></div>
          <div class="skeleton-text" style="width: 150px; height: 40px;"></div>
        </div>
        <div class="skeleton-card" style="height: 300px;"></div>
      </div>
    </div>
  </div>

  <!-- TOUS LES SCRIPTS À LA FIN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // État de l'application
    const app = {
      lang: '{{ lang }}',
      data: null,
      isLoading: true
    };

    // Initialisation au chargement
    document.addEventListener('DOMContentLoaded', function() {
      console.log('🚀 Initialisation du dashboard...');
      
      // Activer le premier onglet
      const firstTab = document.querySelector('.tab-button');
      if (firstTab) {
        firstTab.click();
      }
      
      // Charger les données
      loadDashboardData();
    });

    // Chargement des données AJAX
    async function loadDashboardData() {
      try {
        console.log('📡 Chargement des données depuis l\'API...');
        const startTime = performance.now();
        
        const response = await fetch('/api/admin/dashboard/data');
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        app.data = await response.json();
        
        const endTime = performance.now();
        console.log(`✅ Données chargées en ${((endTime - startTime) / 1000).toFixed(2)} secondes`);
        console.log('📊 Données reçues:', app.data);
        
        app.isLoading = false;
        
        // Mettre à jour l'interface
        updateDashboard();
        
        // Initialiser le graphique
        initializeCharts();
        
      } catch (error) {
        console.error('❌ Erreur chargement données:', error);
        showError();
      }
    }

    function updateDashboard() {
      if (!app.data) {
        console.error('❌ Aucune données disponibles');
        return;
      }
      
      console.log('🔄 Mise à jour du dashboard...');
      
      // 1. Mettre à jour les cartes de statistiques
      updateStatsCards();
      
      // 2. Générer le contenu des onglets
      generateTabs();
      
      console.log('✅ Dashboard mis à jour');
    }

    function updateStatsCards() {
      const stats = app.data.stats;
      console.log('📊 Mise à jour des stats:', stats);
      
      const html = `
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stats-card">
            <div class="stats-number">${stats.enseignants_count}</div>
            <div class="stats-label">${app.lang === 'en' ? 'Teachers' : 'Enseignants'}</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stats-card">
            <div class="stats-number">${stats.eleves_count}</div>
            <div class="stats-label">${app.lang === 'en' ? 'Students' : 'Élèves'}</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stats-card">
            <div class="stats-number">${stats.lecons_count}</div>
            <div class="stats-label">${app.lang === 'en' ? 'Lessons' : 'Leçons'}</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-md-3">
          <div class="stats-card">
            <div class="stats-number">${stats.exercices_count}</div>
            <div class="stats-label">${app.lang === 'en' ? 'Exercises' : 'Exercices'}</div>
          </div>
        </div>
      `;
      
      const statsContainer = document.getElementById('stats-cards');
      if (statsContainer) {
        statsContainer.innerHTML = html;
      } else {
        console.error('❌ Conteneur stats-cards non trouvé');
      }
    }

    function generateTabs() {
      console.log('🔄 Génération des onglets...');
      
      // Structure des onglets avec radio buttons
      const html = `
        <div class="tab-container">
          <!-- Radio buttons pour contrôler les onglets -->
          <input type="radio" name="tab" id="tab-actions" class="tab-radio" checked>
          <input type="radio" name="tab" id="tab-content" class="tab-radio">
          <input type="radio" name="tab" id="tab-monetization" class="tab-radio">
          <input type="radio" name="tab" id="tab-analytics" class="tab-radio">
          
          <!-- Labels = onglets -->
          <div class="tab-list">
            <label for="tab-actions" class="tab-item">
              <span class="tab-button active" onclick="switchTab('actions')">
                <i class="fas fa-tachometer-alt me-2"></i>${app.lang === 'en' ? 'Quick Actions' : 'Actions Rapides'}
              </span>
            </label>
            <label for="tab-content" class="tab-item">
              <span class="tab-button" onclick="switchTab('content')">
                <i class="fas fa-sitemap me-2"></i>${app.lang === 'en' ? 'Content Structure' : 'Structure du Contenu'}
              </span>
            </label>
            <label for="tab-monetization" class="tab-item">
              <span class="tab-button" onclick="switchTab('monetization')">
                <i class="fas fa-money-bill-wave me-2"></i>${app.lang === 'en' ? 'Monetization' : 'Monétisation'}
              </span>
            </label>
            <label for="tab-analytics" class="tab-item">
              <span class="tab-button" onclick="switchTab('analytics')">
                <i class="fas fa-chart-bar me-2"></i>${app.lang === 'en' ? 'Analytics' : 'Analytiques'}
              </span>
            </label>
          </div>
          
          <!-- Panneau Actions Rapides -->
          <div class="tab-pane-css active" id="pane-actions">
            ${generateActionsTab()}
          </div>
          
          <!-- Panneau Structure du Contenu -->
          <div class="tab-pane-css" id="pane-content">
            ${generateContentTab()}
          </div>
          
          <!-- Panneau Monétisation -->
          <div class="tab-pane-css" id="pane-monetization">
            ${generateMonetizationTab()}
          </div>
          
          <!-- Panneau Analytics -->
          <div class="tab-pane-css" id="pane-analytics">
            <div class="content-section mt-4">
              <h4 class="mb-3">${app.lang === 'en' ? 'Platform Analytics' : 'Analytiques de la Plateforme'}</h4>
              <div class="row g-3 g-md-4">
                <div class="col-12 col-md-8">
                  <div class="dashboard-card">
                    <div class="card-header d-flex align-items-center">
                      <i class="fas fa-chart-line me-2"></i>
                      ${app.lang === 'en' ? 'Students per Level' : 'Élèves par Niveau'}
                    </div>
                    <div class="card-body">
                      <canvas id="chartElevesParNiveau" style="width: 100%; height: auto; min-height: 200px;"></canvas>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-md-4">
                  <div class="dashboard-card">
                    <div class="card-header d-flex align-items-center">
                      <i class="fas fa-bell me-2"></i>
                      ${app.lang === 'en' ? 'Recent Activity' : 'Activité Récente'}
                    </div>
                    <div class="card-body">
                      <div class="activity-list">
                        ${generateActivityItems()}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
      
      const contentContainer = document.getElementById('dashboard-content');
      if (contentContainer) {
        contentContainer.innerHTML = html;
      } else {
        console.error('❌ Conteneur dashboard-content non trouvé');
      }
    }

    function generateActionsTab() {
      return `
        <div class="row quick-actions-row g-3 g-md-4">
          <!-- Gestion des Utilisateurs -->
          <div class="col-12 col-md-6 col-lg-4">
            <div class="dashboard-card user-management">
              <div class="card-header">
                <i class="fas fa-users card-icon"></i>
                ${app.lang === 'en' ? 'User Management' : 'Gestion des Utilisateurs'}
              </div>
              <div class="card-body">
                <a href="{{ url_for('creer_enseignant_admin') }}" class="btn action-btn">
                  <i class="fas fa-plus-circle"></i>
                  ${app.lang === 'en' ? 'Add Teacher' : 'Ajouter un Enseignant'}
                </a>
                <a href="/admin/creer-eleve" class="btn action-btn">
                  <i class="fas fa-user-plus"></i>
                  ${app.lang === 'en' ? 'Add Student' : 'Ajouter un Élève'}
                </a>
                <a href="/admin-enseignants" class="btn action-btn">
                  <i class="fas fa-user-edit"></i>
                  ${app.lang === 'en' ? 'Manage Teachers' : 'Gérer les Enseignants'}
                </a>
                <a href="/admin/eleves" class="btn action-btn">
                  <i class="fas fa-user-graduate"></i>
                  ${app.lang === 'en' ? 'Manage Students' : 'Gérer les Élèves'}
                </a>
              </div>
            </div>
          </div>
          <!-- Gestion des Contenus -->
          <div class="col-12 col-md-6 col-lg-4">
            <div class="dashboard-card content-management">
              <div class="card-header">
                <i class="fas fa-book card-icon"></i>
                ${app.lang === 'en' ? 'Content Management' : 'Gestion des Contenus'}
              </div>
              <div class="card-body">
                <a href="/admin/ajouter-niveau" class="btn action-btn">
                  <i class="fas fa-layer-group"></i>
                  ${app.lang === 'en' ? 'Add Level' : 'Ajouter un Niveau'}
                </a>
                <a href="/admin/ajouter-matiere" class="btn action-btn">
                  <i class="fas fa-book-open"></i>
                  ${app.lang === 'en' ? 'Add Subject' : 'Ajouter une Matière'}
                </a>
                <a href="/admin/ajouter-unite" class="btn action-btn">
                  <i class="fas fa-cube"></i>
                  ${app.lang === 'en' ? 'Add Unit' : 'Ajouter une Unité'}
                </a>
                <a href="/admin/ajouter-lecon" class="btn action-btn">
                  <i class="fas fa-file-alt"></i>
                  ${app.lang === 'en' ? 'Add Lesson' : 'Ajouter une Leçon'}
                </a>
                <a href="/admin/import-lessons" class="btn action-btn import-batch-btn">
                  <i class="fas fa-file-import"></i>
                  <div>
                    <strong>${app.lang === 'en' ? 'Batch Import Lessons' : 'Importation de Leçons en Lot'}</strong>
                  </div>
                </a>
                <a href="/admin/batch-create-exercises" class="btn action-btn" 
                   style="border-left: 4px solid #9b59b6; background: rgba(155, 89, 182, 0.1);">
                  <i class="fas fa-file-import" style="color: #9b59b6;"></i>
                  <div>
                    <strong>${app.lang === 'en' ? 'Batch Import Exercises' : 'Importation d\'Exercices en Lot'}</strong>
                  </div>
                </a>
              </div>
            </div>
          </div>
          <!-- Évaluations -->
          <div class="col-12 col-md-6 col-lg-4">
            <div class="dashboard-card evaluations">
              <div class="card-header">
                <i class="fas fa-clipboard-check card-icon"></i>
                ${app.lang === 'en' ? 'Evaluations' : 'Évaluations'}
              </div>
              <div class="card-body">
                <a href="/admin/ajouter-exercice" class="btn action-btn">
                  <i class="fas fa-edit"></i>
                  ${app.lang === 'en' ? 'Add Exercise' : 'Ajouter un Exercice'}
                </a>
                <a href="/admin/exercices" class="btn action-btn">
                  <i class="fas fa-list"></i>
                  ${app.lang === 'en' ? 'Manage Exercises' : 'Gérer les Exercices'}
                </a>
                <a href="/admin/creer-exercice-ia" class="btn action-btn">
                  <i class="fas fa-robot"></i>
                  ${app.lang === 'en' ? 'Generate Exercises (AI)' : 'Générer des Exercices (IA)'}
                </a>
                <a href="/admin/ajouter-test" class="btn action-btn">
                  <i class="fas fa-vial"></i>
                  ${app.lang === 'en' ? 'Add Summative Test' : 'Ajouter un Test Sommatif'}
                </a>
                <a href="/admin/creer-test-sommatif-ia" class="btn action-btn">
                  <i class="fas fa-magic"></i>
                  ${app.lang === 'en' ? 'Generate Summative Test (AI)' : 'Générer un Test Sommatif (IA)'}
                </a>
                <a href="/admin/tests" class="btn action-btn">
                  <i class="fas fa-list"></i>
                  ${app.lang === 'en' ? 'View All Tests' : 'Voir tous les Tests'}
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function generateContentTab() {
      if (!app.data || !app.data.niveaux || app.data.niveaux.length === 0) {
        return `
          <div class="text-center py-4">
            <i class="fas fa-layer-group fa-3x text-muted mb-3"></i>
            <p class="text-muted">${app.lang === 'en' ? 'No content levels defined yet.' : 'Aucun niveau de contenu défini pour le moment.'}</p>
            <a href="/admin/ajouter-niveau" class="btn btn-primary">
              <i class="fas fa-plus me-2"></i>
              ${app.lang === 'en' ? 'Add First Level' : 'Ajouter un Premier Niveau'}
            </a>
          </div>
        `;
      }
      
      console.log('📚 Génération du contenu avec', app.data.niveaux.length, 'niveaux');
      
      let html = '<div class="accordion" id="contentAccordion">';
      
      app.data.niveaux.forEach((niveau) => {
        const matieresCount = niveau.matieres ? niveau.matieres.length : 0;
        html += `
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingNiveau${niveau.id}">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseNiveau${niveau.id}" aria-expanded="false" aria-controls="collapseNiveau${niveau.id}">
                <i class="fas fa-layer-group me-2 text-primary"></i>
                ${niveau.nom}
                <span class="badge bg-primary badge-pill ms-2">${matieresCount} ${app.lang === 'en' ? 'subjects' : 'matières'}</span>
              </button>
            </h2>
            <div id="collapseNiveau${niveau.id}" class="accordion-collapse collapse" aria-labelledby="headingNiveau${niveau.id}" data-bs-parent="#contentAccordion">
              <div class="accordion-body">
                <div class="accordion" id="matiereAccordion${niveau.id}">
                  ${generateMatieresHTML(niveau.matieres, niveau.id)}
                </div>
              </div>
            </div>
          </div>
        `;
      });
      
      html += '</div>';
      return html;
    }

    function generateMatieresHTML(matieres, niveauId) {
      if (!matieres || matieres.length === 0) {
        return `<p class="text-muted">${app.lang === 'en' ? 'No subjects available' : 'Aucune matière disponible'}</p>`;
      }
      
      let html = '';
      matieres.forEach(matiere => {
        const unitesCount = matiere.unites ? matiere.unites.length : 0;
        html += `
          <div class="accordion-item">
            <h2 class="accordion-header" id="headingMatiere${matiere.id}">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMatiere${matiere.id}" aria-expanded="false" aria-controls="collapseMatiere${matiere.id}">
                <i class="fas fa-book me-2 text-success"></i>
                ${matiere.nom}
                <span class="badge bg-success badge-pill ms-2">${unitesCount} ${app.lang === 'en' ? 'units' : 'unités'}</span>
              </button>
            </h2>
            <div id="collapseMatiere${matiere.id}" class="accordion-collapse collapse" aria-labelledby="headingMatiere${matiere.id}" data-bs-parent="#matiereAccordion${niveauId}">
              <div class="accordion-body">
                ${generateUnitesHTML(matiere.unites, matiere.id)}
              </div>
            </div>
          </div>
        `;
      });
      
      return html;
    }

    function generateUnitesHTML(unites, matiereId) {
      if (!unites || unites.length === 0) {
        return `<p class="text-muted">${app.lang === 'en' ? 'No units available' : 'Aucune unité disponible'}</p>`;
      }
      
      let html = '';
      unites.forEach(unite => {
        const leconsCount = unite.lecons ? unite.lecons.length : 0;
        const testsCount = unite.tests ? unite.tests.length : 0;
        const totalItems = leconsCount + testsCount;
        
        html += `
          <div class="card mb-3">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
              <span><i class="fas fa-cube me-2"></i>${unite.nom}</span>
              <span class="badge bg-light text-dark">${totalItems} ${app.lang === 'en' ? 'items' : 'éléments'}</span>
            </div>
            <div class="card-body">
              ${generateLeconsHTML(unite.lecons, unite.tests)}
            </div>
          </div>
        `;
      });
      
      return html;
    }

    function generateLeconsHTML(lecons, tests) {
      let html = '';
      
      // Tests
      if (tests && tests.length > 0) {
        html += `<h6 class="text-warning mb-2">${app.lang === 'en' ? 'Summative Tests' : 'Tests Sommatifs'}</h6>`;
        tests.forEach(test => {
          html += `
            <div class="content-item lecon-item mb-2">
              <div class="content-info">
                <i class="fas fa-vial me-2 text-warning"></i>
                ${app.lang === 'en' ? 'Test' : 'Test'} #${test.id}
              </div>
            </div>
          `;
        });
      }
      
      // Leçons
      if (lecons && lecons.length > 0) {
        html += `<h6 class="text-secondary mb-2 mt-3">${app.lang === 'en' ? 'Lessons' : 'Leçons'}</h6>`;
        lecons.forEach(lecon => {
          html += `
            <div class="content-item lecon-item mb-2">
              <div class="content-info">
                <i class="fas fa-file-alt me-2 text-secondary"></i>
                ${lecon.titre}
              </div>
            </div>
          `;
        });
      }
      
      if (!tests?.length && !lecons?.length) {
        html += `<p class="text-muted mb-0">${app.lang === 'en' ? 'No content' : 'Aucun contenu'}</p>`;
      }
      
      return html;
    }

    function generateMonetizationTab() {
      if (!app.data || !app.data.monetization_stats) {
        return '<p class="text-center py-4">Chargement...</p>';
      }
      
      const m = app.data.monetization_stats;
      const payments = app.data.recent_payments || [];
      const teachers = app.data.teacher_commissions || [];
      
      console.log('💰 Génération monétisation avec', payments.length, 'paiements');
      
      return `
        <div class="content-section mt-4">
          <h4 class="mb-3">
            <i class="fas fa-money-bill-wave me-2 text-success"></i>
            ${app.lang === 'en' ? 'Teacher Commissions & Payments' : 'Commissions & Paiements Enseignants'}
          </h4>
          
          <!-- Cartes de statistiques monétaires -->
          <div class="row g-3 g-md-4 mb-4">
            <div class="col-12 col-sm-6 col-md-3">
              <div class="stats-card" style="border-left: 4px solid #10b981;">
                <div class="stats-number text-success">$${m.total_commissions.toFixed(2)}</div>
                <div class="stats-label">${app.lang === 'en' ? 'Total Commissions' : 'Commissions Totales'}</div>
              </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
              <div class="stats-card" style="border-left: 4px solid #f59e0b;">
                <div class="stats-number text-warning">$${m.pending_payments.toFixed(2)}</div>
                <div class="stats-label">${app.lang === 'en' ? 'Pending Payments' : 'Paiements en Attente'}</div>
              </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
              <div class="stats-card" style="border-left: 4px solid #3b82f6;">
                <div class="stats-number text-info">${m.payments_count}</div>
                <div class="stats-label">${app.lang === 'en' ? 'Payments Made' : 'Paiements Effectués'}</div>
              </div>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
              <div class="stats-card" style="border-left: 4px solid #8b5cf6;">
                <div class="stats-number text-purple">${m.active_teachers}</div>
                <div class="stats-label">${app.lang === 'en' ? 'Active Teachers' : 'Enseignants Actifs'}</div>
              </div>
            </div>
          </div>
          
          <!-- Tableau des paiements récents -->
          <div class="dashboard-card mb-4">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
              <div>
                <i class="fas fa-history me-2"></i>
                ${app.lang === 'en' ? 'Recent Payments' : 'Paiements Récents'}
              </div>
              <a href="/admin/versements-manuels" target="_blank" class="btn btn-sm btn-success">
                ${app.lang === 'en' ? 'View All' : 'Voir Tout'}
              </a>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-monetization table-hover mb-0">
                  <thead>
                    <tr>
                      <th>${app.lang === 'en' ? 'Teacher' : 'Enseignant'}</th>
                      <th>${app.lang === 'en' ? 'Amount' : 'Montant'}</th>
                      <th>${app.lang === 'en' ? 'Status' : 'Statut'}</th>
                      <th>${app.lang === 'en' ? 'Date' : 'Date'}</th>
                      <th>${app.lang === 'en' ? 'Actions' : 'Actions'}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${payments.map(p => `
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                              ${p.enseignant_nom ? p.enseignant_nom.charAt(0) : '?'}
                            </div>
                            <div>
                              <div class="fw-bold">${p.enseignant_nom || 'N/A'}</div>
                              <small class="text-muted">${p.email || ''}</small>
                            </div>
                          </div>
                        </td>
                        <td class="fw-bold">$${p.montant_total.toFixed(2)}</td>
                        <td>
                          <span class="badge-${p.statut === 'complete' ? 'paid' : (p.statut === 'en_cours' ? 'processing' : (p.statut === 'demande' ? 'demande' : 'pending'))}">
                            ${p.statut === 'complete' ? (app.lang === 'en' ? 'Paid' : 'Payé') : 
                              (p.statut === 'en_cours' ? (app.lang === 'en' ? 'Processing' : 'En traitement') :
                              (p.statut === 'demande' ? (app.lang === 'en' ? 'Request' : 'Demande') : 
                              (app.lang === 'en' ? 'Pending' : 'En attente')))}
                          </span>
                        </td>
                        <td>${p.date}</td>
                        <td>
                          <div class="action-buttons">
                            <button class="btn-action btn-view" onclick="viewPaymentDetails(${p.id})" title="${app.lang === 'en' ? 'View details' : 'Voir détails'}">
                              <i class="fas fa-eye"></i>
                            </button>
                          </div>
                        </td>
                      </tr>
                    `).join('')}
                    ${payments.length === 0 ? `
                      <tr>
                        <td colspan="5" class="text-center py-4 text-muted">
                          <i class="fas fa-money-bill-wave fa-2x mb-2"></i>
                          <p>${app.lang === 'en' ? 'No recent payments' : 'Aucun paiement récent'}</p>
                        </td>
                      </tr>
                    ` : ''}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          
          <!-- Section des enseignants avec commissions -->
          <div class="dashboard-card">
            <div class="card-header">
              <i class="fas fa-chart-line card-icon"></i>
              ${app.lang === 'en' ? 'Teacher Commission Overview' : 'Aperçu des Commissions Enseignants'}
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover mb-0">
                  <thead>
                    <tr>
                      <th>${app.lang === 'en' ? 'Teacher' : 'Enseignant'}</th>
                      <th>${app.lang === 'en' ? 'Total Commissions' : 'Commissions Totales'}</th>
                      <th>${app.lang === 'en' ? 'Pending' : 'En Attente'}</th>
                      <th>${app.lang === 'en' ? 'Paid' : 'Payé'}</th>
                      <th>${app.lang === 'en' ? 'Students' : 'Élèves'}</th>
                      <th>${app.lang === 'en' ? 'Last Payment' : 'Dernier Paiement'}</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${teachers.map(t => `
                      <tr>
                        <td>
                          <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px;">
                              ${t.nom_complet ? t.nom_complet.charAt(0) : '?'}
                            </div>
                            <div>
                              <div class="fw-bold">${t.nom_complet || 'N/A'}</div>
                              <small class="text-muted">${t.email || ''}</small>
                            </div>
                          </div>
                        </td>
                        <td class="fw-bold">$${t.total_commissions.toFixed(2)}</td>
                        <td class="text-warning">$${t.pending.toFixed(2)}</td>
                        <td class="text-success">$${t.paid.toFixed(2)}</td>
                        <td>${t.students_count}</td>
                        <td>${t.last_payment}</td>
                      </tr>
                    `).join('')}
                    ${teachers.length === 0 ? `
                      <tr>
                        <td colspan="6" class="text-center py-4 text-muted">
                          <i class="fas fa-user-tie fa-2x mb-2"></i>
                          <p>${app.lang === 'en' ? 'No teacher commission data' : 'Aucune donnée de commission'}</p>
                        </td>
                      </tr>
                    ` : ''}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function generateActivityItems() {
      return `
        <div class="activity-item d-flex mb-3">
          <div class="activity-icon bg-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
            <i class="fas fa-user-plus text-white"></i>
          </div>
          <div>
            <p class="mb-0">${app.lang === 'en' ? 'New teacher registered' : 'Nouvel enseignant inscrit'}</p>
            <small class="text-muted">2 hours ago</small>
          </div>
        </div>
        <div class="activity-item d-flex mb-3">
          <div class="activity-icon bg-success rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
            <i class="fas fa-book text-white"></i>
          </div>
          <div>
            <p class="mb-0">${app.lang === 'en' ? 'New lesson added' : 'Nouvelle leçon ajoutée'}</p>
            <small class="text-muted">5 hours ago</small>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {
      console.log('🔄 Changement vers onglet:', tab);
      
      // Mettre à jour les classes des boutons
      document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-pane-css').forEach(p => p.classList.remove('active'));
      
      // Activer le bon onglet
      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach(b => {
        if (b.textContent.toLowerCase().includes(tab) || 
            (tab === 'actions' && b.textContent.includes('Actions')) ||
            (tab === 'content' && b.textContent.includes('Content')) ||
            (tab === 'monetization' && b.textContent.includes('Monetization')) ||
            (tab === 'analytics' && b.textContent.includes('Analytics'))) {
          b.classList.add('active');
        }
      });
      
      const pane = document.getElementById(`pane-${tab}`);
      if (pane) {
        pane.classList.add('active');
      }
    }

    function initializeCharts() {
      const ctx = document.getElementById('chartElevesParNiveau');
      if (ctx && app.data && app.data.eleves_par_niveau && app.data.eleves_par_niveau.length > 0) {
        console.log('📊 Initialisation du graphique avec', app.data.eleves_par_niveau.length, 'données');
        
        const labels = app.data.eleves_par_niveau.map(item => item[0]);
        const data = app.data.eleves_par_niveau.map(item => item[1]);
        
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: app.lang === 'en' ? 'Students per level' : 'Élèves par niveau',
              data: data,
              backgroundColor: ['#4361ee', '#3fba83', '#fcc419', '#e85959', '#17a2b8', '#9b59b6', '#ff6b6b'],
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: { display: false },
              title: {
                display: true,
                text: app.lang === 'en' ? 'Students per level' : 'Répartition des élèves par niveau',
                font: { size: 16 }
              }
            },
            scales: {
              y: { beginAtZero: true, ticks: { precision: 0 } }
            }
          }
        });
        console.log('✅ Graphique chargé');
      } else {
        console.log('📊 Pas de données pour le graphique');
      }
    }

    function viewPaymentDetails(paymentId) {
      fetch(`/admin/versements-manuels/${paymentId}/details`)
        .then(response => response.json())
        .then(data => {
          const statusMap = {
            'complete': app.lang === 'en' ? 'Paid' : 'Payé',
            'en_cours': app.lang === 'en' ? 'Processing' : 'En traitement',
            'demande': app.lang === 'en' ? 'Request' : 'Demande'
          };
          
          Swal.fire({
            title: app.lang === 'en' ? 'Payment Details' : 'Détails du paiement',
            html: `
              <div class="payment-details" style="text-align: left;">
                <div class="payment-row mb-2">
                  <span class="payment-label fw-bold">${app.lang === 'en' ? 'Teacher:' : 'Enseignant:'}</span>
                  <span class="payment-value ms-2">${data.payment?.enseignant_nom || 'N/A'}</span>
                </div>
                <div class="payment-row mb-2">
                  <span class="payment-label fw-bold">${app.lang === 'en' ? 'Amount:' : 'Montant:'}</span>
                  <span class="payment-value ms-2">$${(data.payment?.montant_total || 0).toFixed(2)}</span>
                </div>
                <div class="payment-row mb-2">
                  <span class="payment-label fw-bold">${app.lang === 'en' ? 'Status:' : 'Statut:'}</span>
                  <span class="payment-value ms-2">${statusMap[data.payment?.statut] || data.payment?.statut || 'N/A'}</span>
                </div>
                <div class="payment-row mb-2">
                  <span class="payment-label fw-bold">${app.lang === 'en' ? 'Date:' : 'Date:'}</span>
                  <span class="payment-value ms-2">${data.payment?.date_demande || 'N/A'}</span>
                </div>
                ${data.payment?.reference_interac ? `<div class="payment-row">
                  <span class="payment-label fw-bold">${app.lang === 'en' ? 'Reference:' : 'Référence:'}</span>
                  <span class="payment-value ms-2">${data.payment.reference_interac}</span>
                </div>` : ''}
              </div>
            `,
            icon: 'info',
            confirmButtonText: app.lang === 'en' ? 'OK' : 'OK'
          });
        })
        .catch(error => {
          console.error('Error:', error);
          Swal.fire(
            app.lang === 'en' ? 'Error' : 'Erreur',
            app.lang === 'en' ? 'Unable to load details' : 'Impossible de charger les détails',
            'error'
          );
        });
    }

    function markAsPaid(paymentId) {
      Swal.fire({
        title: app.lang === 'en' ? 'Confirm Payment' : 'Confirmer le paiement',
        text: app.lang === 'en' ? 'Mark this payment as completed?' : 'Marquer ce paiement comme effectué ?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        cancelButtonColor: '#6c757d',
        confirmButtonText: app.lang === 'en' ? 'Yes, mark as paid' : 'Oui, marquer comme payé',
        cancelButtonText: app.lang === 'en' ? 'Cancel' : 'Annuler',
        input: 'text',
        inputLabel: app.lang === 'en' ? 'Interac Reference (optional)' : 'Référence Interac (optionnel)',
        inputPlaceholder: app.lang === 'en' ? 'Enter reference...' : 'Entrez la référence...'
      }).then((result) => {
        if (result.isConfirmed) {
          const reference = result.value || '';
          fetch(`/api/admin/versement/${paymentId}/traiter`, { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              reference_interac: reference,
              preuve_versement: null
            })
          })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              Swal.fire(
                app.lang === 'en' ? 'Success' : 'Succès',
                data.message || (app.lang === 'en' ? 'Payment marked as completed' : 'Paiement marqué comme complété'),
                'success'
              );
              setTimeout(() => location.reload(), 1500);
            } else {
              Swal.fire(
                app.lang === 'en' ? 'Error' : 'Erreur',
                data.error || data.message || (app.lang === 'en' ? 'An error occurred' : 'Une erreur est survenue'),
                'error'
              );
            }
          })
          .catch(error => {
            console.error('Error:', error);
            Swal.fire(
              app.lang === 'en' ? 'Error' : 'Erreur',
              app.lang === 'en' ? 'An error occurred' : 'Une erreur est survenue',
              'error'
            );
          });
        }
      });
    }

    function sendPaymentReminder(teacherId) {
      fetch(`/admin/teacher/${teacherId}/send-reminder`, { 
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          Swal.fire(
            app.lang === 'en' ? 'Reminder Sent' : 'Rappel envoyé',
            data.message || (app.lang === 'en' ? 'Payment reminder sent successfully' : 'Rappel de paiement envoyé avec succès'),
            'success'
          );
        } else {
          Swal.fire(
            app.lang === 'en' ? 'Error' : 'Erreur',
            data.message || (app.lang === 'en' ? 'Failed to send reminder' : 'Échec de l\'envoi du rappel'),
            'error'
          );
        }
      })
      .catch(error => {
        console.error('Error:', error);
        Swal.fire(
          app.lang === 'en' ? 'Error' : 'Erreur',
          app.lang === 'en' ? 'Failed to send reminder' : 'Échec de l\'envoi du rappel',
          'error'
        );
      });
    }

    function showError() {
      Swal.fire({
        icon: 'error',
        title: app.lang === 'en' ? 'Error' : 'Erreur',
        text: app.lang === 'en' ? 'Failed to load dashboard data' : 'Échec du chargement des données',
        confirmButtonText: app.lang === 'en' ? 'Retry' : 'Réessayer'
      }).then(() => loadDashboardData());
    }

    // Gestion du thème
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = themeToggle.querySelector('i');

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    themeToggle.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeIcon.className = 'fas fa-sun';
      } else {
        themeIcon.className = 'fas fa-moon';
      }
    }
  </script>
</body>
</html>
